{% extends 'base.html' %}

{% block title %}Guest Checkout - StoryCandy{% endblock %}

{% block content %}
<div class="py-8 sm:py-12 bg-base-100 min-h-[calc(100vh-160px)] text-brand-plum flex flex-col justify-center items-center">
  
  <div class="max-w-xl w-full px-4 sm:px-6">

    <!-- Main Checkout Card -->
    <div class="bg-white rounded-3xl border border-brand-plum/10 shadow-xl overflow-hidden">
      
      <!-- Order Summary Banner -->
      <div class="bg-base-200/50 p-6 border-b border-brand-plum/10 flex items-center justify-between">
        <div>
          <span class="text-xs font-bold text-brand-plum/60 uppercase tracking-wider block">Total Amount</span>
          <span class="text-2xl sm:text-3xl font-black text-brand-plum">₹{{ total_amount }}</span>
        </div>
        <div class="flex items-center gap-1.5 bg-emerald-50 text-emerald-700 text-xs font-bold px-3 py-1.5 rounded-full border border-emerald-200">
          <!-- Lucide: Shield Check -->
          <svg class="w-4 h-4 text-emerald-600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
          <span>Secure Checkout</span>
        </div>
      </div>

      <!-- Checkout Form -->
      <form method="POST" action="{% url 'payment' %}" class="p-6 sm:p-8 space-y-5">
        {% csrf_token %}

        <!-- Full Name -->
        <div>
          <label for="full_name" class="block text-xs font-extrabold uppercase tracking-wider text-brand-plum/70 mb-1.5">
            Full Name <span class="text-brand-coral">*</span>
          </label>
          <div class="relative">
            <input 
              type="text" 
              id="full_name" 
              name="full_name" 
              required 
              placeholder="e.g. Ananya Sharma"
              class="w-full px-4 py-3 pl-10 rounded-xl border border-brand-plum/15 focus:outline-none focus:border-brand-teal focus:ring-2 focus:ring-brand-teal/20 text-sm font-medium transition"
            >
            <div class="absolute left-3 top-1/2 -translate-y-1/2 text-brand-plum/40 pointer-events-none">
              <!-- Lucide: User -->
              <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
          </div>
        </div>

        <!-- Email & Phone Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Email -->
          <div>
            <label for="email" class="block text-xs font-extrabold uppercase tracking-wider text-brand-plum/70 mb-1.5">
              Email Address <span class="text-brand-coral">*</span>
            </label>
            <div class="relative">
              <input 
                type="email" 
                id="email" 
                name="email" 
                required 
                placeholder="name@example.com"
                class="w-full px-4 py-3 pl-10 rounded-xl border border-brand-plum/15 focus:outline-none focus:border-brand-teal focus:ring-2 focus:ring-brand-teal/20 text-sm font-medium transition"
              >
              <div class="absolute left-3 top-1/2 -translate-y-1/2 text-brand-plum/40 pointer-events-none">
                <!-- Lucide: Mail -->
                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              </div>
            </div>
          </div>

          <!-- Phone Number -->
          <div>
            <label for="phone" class="block text-xs font-extrabold uppercase tracking-wider text-brand-plum/70 mb-1.5">
              Phone Number <span class="text-brand-coral">*</span>
            </label>
            <div class="relative">
              <input 
                type="tel" 
                id="phone" 
                name="phone" 
                required 
                placeholder="+91 98765 43210"
                class="w-full px-4 py-3 pl-10 rounded-xl border border-brand-plum/15 focus:outline-none focus:border-brand-teal focus:ring-2 focus:ring-brand-teal/20 text-sm font-medium transition"
              >
              <div class="absolute left-3 top-1/2 -translate-y-1/2 text-brand-plum/40 pointer-events-none">
                <!-- Lucide: Phone -->
                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              </div>
            </div>
          </div>
        </div>

        <!-- Shipping Address -->
        <div>
          <label for="shipping_address" class="block text-xs font-extrabold uppercase tracking-wider text-brand-plum/70 mb-1.5">
            Shipping Address <span class="text-brand-coral">*</span>
          </label>
          <div class="relative">
            <textarea 
              id="shipping_address" 
              name="shipping_address" 
              rows="3" 
              required 
              placeholder="House No., Street, City, State, Pincode"
              class="w-full px-4 py-3 pl-10 rounded-xl border border-brand-plum/15 focus:outline-none focus:border-brand-teal focus:ring-2 focus:ring-brand-teal/20 text-sm font-medium transition resize-none"
            ></textarea>
            <div class="absolute left-3 top-3.5 text-brand-plum/40 pointer-events-none">
              <!-- Lucide: MapPin -->
              <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
          </div>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          class="w-full bg-brand-coral hover:bg-brand-coral/90 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg hover:shadow-xl transition duration-200 mt-2 flex items-center justify-center gap-2 group cursor-pointer"
        >
          <span>Proceed to Payment</span>
          <!-- Lucide: Arrow Right -->
          <svg class="w-4 h-4 transition-transform group-hover:translate-x-1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/>
            <path d="m12 5 7 7-7 7"/>
          </svg>
        </button>
      </form>

    </div>

    <!-- Back Link -->
    <div class="text-center mt-6">
      <a href="{% url 'cart' %}" class="text-xs font-bold text-brand-plum/60 hover:text-brand-coral transition inline-flex items-center gap-1">
        <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        <span>Return to Cart</span>
      </a>
    </div>

  </div>

</div>
{% endblock %}
